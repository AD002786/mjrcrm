<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal Desk — Wholesale CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#070b09; --side:#040705; --side-2:#0f1814; --card:#0e1512; --card-2:#131d19; --card-3:#18241f; --input:#0a100d;
  --ink:#eef4ef; --ink-2:#c9d6cd; --mute:#8b9d93; --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.13);
  --g:#76be43; --g-hi:#93d661; --g-txt:#9edb72; --g-soft:rgba(118,190,67,.14); --g-glow:rgba(118,190,67,.35);
  --amber:#f2b552; --amber-soft:rgba(242,181,82,.13); --red:#ff8278; --red-soft:rgba(255,130,120,.13); --blue:#82adff; --blue-soft:rgba(130,173,255,.13); --violet:#b69cff;
  --f:'Geist',system-ui,sans-serif; --m:'Geist Mono',ui-monospace,monospace;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -24px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font:14px/1.5 var(--f);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:rgba(118,190,67,.35)}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
input::placeholder,textarea::placeholder{color:#5f7168}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#1f2c26;border-radius:10px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}
.app{display:flex;min-height:100vh}

/* sidebar */
.side{width:236px;flex:none;background:linear-gradient(180deg,#06100b 0%,var(--side) 60%);border-right:1px solid var(--line);color:var(--ink-2);display:flex;flex-direction:column;padding:20px 12px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 24px;font-weight:700;font-size:17px;letter-spacing:-.02em;color:#fff}
.brand i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--g-hi),#4f9228);display:grid;place-items:center;box-shadow:0 6px 18px -6px var(--g-glow),inset 0 1px 0 rgba(255,255,255,.3)}
.brand small{display:block;font:500 10.5px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 12px;border:0;border-radius:10px;background:none;color:#a7b8ae;text-align:left;font-weight:500;transition:background .15s,color .15s}
.nav button svg{opacity:.8}
.nav button:hover{background:rgba(255,255,255,.04);color:#fff}
.nav button.on{background:linear-gradient(90deg,rgba(118,190,67,.18),rgba(118,190,67,.04));color:#fff}
.nav button.on svg{color:var(--g-hi);opacity:1}
.nav button.on::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--g);box-shadow:0 0 12px var(--g)}
.nav .count{margin-left:auto;font:500 11px var(--m);color:var(--mute);background:rgba(255,255,255,.05);padding:1px 7px;border-radius:999px}
.nav button.on .count{color:var(--g-txt);background:rgba(118,190,67,.14)}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--mute);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.dot.ok{background:var(--g);box-shadow:0 0 0 3px rgba(118,190,67,.2),0 0 10px var(--g)}
.dot.warn{background:var(--amber)}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:radial-gradient(1100px 420px at 70% -120px,rgba(118,190,67,.10),transparent 70%)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:26px 32px 18px}
.top h1{margin:0;font-size:26px;letter-spacing:-.035em;font-weight:600;margin-right:auto;color:#fff}
.search{display:flex;align-items:center;gap:8px;background:var(--input);border:1px solid var(--line-2);border-radius:10px;padding:0 12px;min-height:40px;width:290px;max-width:100%;color:var(--mute);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:rgba(118,190,67,.6);box-shadow:0 0 0 3px rgba(118,190,67,.15)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--card-2);color:var(--ink);font-weight:500;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--card-3);border-color:rgba(255,255,255,.2)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:#eef4ef;border-color:#eef4ef;color:#07130c;font-weight:600}
.btn.pri:hover{background:#fff}
.btn.green{background:var(--g);border-color:var(--g);color:#07130c;font-weight:600;box-shadow:0 8px 24px -10px var(--g-glow)}
.btn.green:hover{background:var(--g-hi);border-color:var(--g-hi)}
.btn.danger{color:var(--red);border-color:rgba(255,130,120,.35);background:transparent}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.content{padding:0 32px 56px;flex:1}
.banner{margin:0 32px 16px;padding:12px 16px;border-radius:10px;background:var(--amber-soft);border:1px solid rgba(242,181,82,.3);color:var(--amber);font-size:13.5px;display:none}
.banner.show{display:block}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;align-items:center}
.chip{min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font-size:13px;color:var(--ink-2);transition:all .15s}
.chip:hover{border-color:rgba(255,255,255,.22);color:#fff}
.chip.on{background:var(--g-soft);border-color:rgba(118,190,67,.55);color:var(--g-txt)}
select.f{min-height:34px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);padding:0 12px;font-size:13px;color:var(--ink-2)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
.kpi{position:relative;background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);overflow:hidden}
.kpi::after{content:"";position:absolute;left:20px;right:20px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(118,190,67,.45),transparent);opacity:.6}
.kpi span{font-size:12px;color:var(--mute);font-weight:500;letter-spacing:.01em}
.kpi b{display:block;font-size:28px;letter-spacing:-.035em;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;color:#fff}
.kpi b.g{color:var(--g-hi);text-shadow:0 0 24px rgba(118,190,67,.35)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 14px;font-size:15px;font-weight:600;color:#fff;letter-spacing:-.01em}
.row-list{display:flex;flex-direction:column}
.row-list button{display:flex;align-items:center;gap:12px;padding:11px 8px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;border-radius:8px;transition:background .15s}
.row-list button:first-child{border-top:0}
.row-list button:hover{background:rgba(255,255,255,.035)}
.row-list .grow{flex:1;min-width:0}
.row-list .t{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.row-list .s{font-size:12.5px;color:var(--mute)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:12px;font-size:13px;color:var(--ink-2)}
.bar .track{height:8px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,#4f9228,var(--g-hi));border-radius:6px;box-shadow:0 0 10px rgba(118,190,67,.5)}
.bar b{text-align:right;font-variant-numeric:tabular-nums;color:#fff}
.empty{padding:32px;text-align:center;color:var(--mute);font-size:13.5px}
.empty b{color:var(--ink)}

/* pills + avatars */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:rgba(255,255,255,.07);color:var(--ink-2);border:1px solid rgba(255,255,255,.06)}
.pill.g{background:var(--g-soft);color:var(--g-txt);border-color:rgba(118,190,67,.25)}
.pill.a{background:var(--amber-soft);color:var(--amber);border-color:rgba(242,181,82,.25)}
.pill.r{background:var(--red-soft);color:var(--red);border-color:rgba(255,130,120,.25)}
.pill.b{background:var(--blue-soft);color:var(--blue);border-color:rgba(130,173,255,.25)}
.av{width:32px;height:32px;border-radius:10px;display:inline-grid;place-items:center;font-size:12px;font-weight:600;flex:none;color:#07130c;letter-spacing:.02em}
.who{display:flex;align-items:center;gap:11px}
.who .nm{display:block;font-weight:600;color:var(--ink)}

/* kanban */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.col{flex:0 0 276px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:16px;padding:10px;min-height:220px}
.col.drop{outline:2px dashed var(--g);outline-offset:-2px;background:rgba(118,190,67,.06)}
.col-h{display:flex;align-items:center;gap:8px;padding:6px 6px 12px;font-weight:600;font-size:13px;color:#fff}
.col-h .sd{width:8px;height:8px;border-radius:50%;flex:none}
.col-h span:last-child{margin-left:auto;font:500 11px var(--m);color:var(--mute);background:rgba(255,255,255,.06);padding:1px 7px;border-radius:999px}
.col-sum{font-size:11.5px;color:var(--g-txt);padding:0 6px 10px;margin-top:-8px}
.deal{display:block;width:100%;text-align:left;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px;cursor:grab;color:var(--ink);transition:border-color .15s,transform .15s,box-shadow .15s}
.deal:hover{border-color:rgba(118,190,67,.4);transform:translateY(-1px);box-shadow:0 12px 28px -16px rgba(0,0,0,.9)}
.deal .n{font-weight:600;display:block;margin-bottom:2px;color:#fff}
.deal .ad{font-size:12.5px;color:var(--mute);display:block;margin-bottom:8px}
.deal .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.deal .price{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;color:#fff}

/* tables */
.tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow-x:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:820px}
th{font-size:11.5px;font-weight:500;color:var(--mute);text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:rgba(255,255,255,.02);text-transform:uppercase;letter-spacing:.06em;font-family:var(--m)}
th button{border:0;background:none;padding:0;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit}
th button:hover{color:var(--ink)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink-2)}
td b{color:var(--ink)}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover td{background:rgba(118,190,67,.05)}
td .sub{display:block;font-size:12.5px;color:var(--mute)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.due{color:var(--red);font-weight:600}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,100%);background:#0a110e;border-left:1px solid var(--line-2);z-index:50;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-30px 0 80px -20px rgba(0,0,0,.8)}
.drawer.show{transform:none}
.dr-h{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line);background:var(--card)}
.dr-h h2{margin:0;font-size:18px;letter-spacing:-.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
.x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--card-2);color:var(--ink);display:grid;place-items:center}
.x:hover{background:var(--card-3)}
.dr-b{flex:1;overflow-y:auto;padding:22px 24px 32px}
.dr-f{display:flex;gap:10px;padding:14px 24px;border-top:1px solid var(--line);background:var(--card)}
.dr-f .sp{flex:1}
.sec{margin:0 0 10px;font:500 11px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--g-txt);opacity:.85}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;margin-bottom:26px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mute);font-weight:500}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea,.inline input{min-height:40px;padding:0 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--input);color:var(--ink);font-size:14px;transition:border-color .15s,box-shadow .15s}
.form input:focus,.form select:focus,.form textarea:focus,.inline input:focus,.rep-bar input:focus,.rep-bar select:focus,.comps input[type=text]:focus{outline:0;border-color:rgba(118,190,67,.6);box-shadow:0 0 0 3px rgba(118,190,67,.15)}
.form textarea{padding:10px 12px;min-height:90px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{flex-direction:row;align-items:center;gap:7px;min-height:34px;padding:0 12px;border:1px solid var(--line-2);border-radius:999px;background:var(--input);color:var(--ink-2);font-weight:400;cursor:pointer}
.checks label:has(input:checked){background:var(--g-soft);border-color:rgba(118,190,67,.5);color:var(--g-txt)}
.checks input{min-height:0;margin:0;accent-color:var(--g)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:24px}
.match{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.match:first-of-type{border-top:0}
.match .grow{flex:1;min-width:0}
.match select{min-height:32px;border-radius:8px;border:1px solid var(--line-2);background:var(--input);font-size:12.5px;padding:0 8px}
.log{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.log div{font-size:13px;padding:9px 11px;background:var(--card-2);border:1px solid var(--line);border-left:2px solid var(--g);border-radius:8px;color:var(--ink-2)}
.log time{display:block;font:500 11px var(--m);color:var(--mute)}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-height:38px}
.confirm{display:none;align-items:center;gap:8px;font-size:13px;color:var(--red)}
.confirm.show{display:flex}

/* calculator */
.calc{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;align-items:start}
.calc .panel{margin-bottom:16px}
.calc .form{margin-bottom:4px}
.calc-res{position:sticky;top:16px}
.res-big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.res-big div{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.res-big span{font-size:12px;color:var(--mute)}
.res-big b{display:block;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#fff}
.res-big .hero{grid-column:1/-1;background:linear-gradient(135deg,rgba(118,190,67,.22),rgba(118,190,67,.05));border-color:rgba(118,190,67,.35)}
.res-big .hero span{color:var(--g-txt)}
.res-big .hero b{font-size:32px;color:#fff}
.lines{display:flex;flex-direction:column;font-size:13.5px;color:var(--ink-2)}
.lines div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.lines div:first-child{border-top:0}
.lines b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.lines .tot{font-weight:600;border-top:1px solid var(--line-2);color:#fff}
.grade{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:10px;font-size:13px;margin-bottom:14px;border:1px solid transparent}
.grade.good{background:var(--g-soft);color:var(--g-txt);border-color:rgba(118,190,67,.3)}
.grade.ok{background:var(--amber-soft);color:var(--amber);border-color:rgba(242,181,82,.3)}
.grade.bad{background:var(--red-soft);color:var(--red);border-color:rgba(255,130,120,.3)}
.comps{width:100%;min-width:760px;border-collapse:collapse}
.comps th{background:none;padding:6px 6px;font-size:10.5px}
.comps td{padding:4px 4px;border-bottom:1px solid var(--line)}
.comps tbody tr{cursor:default}
.comps tbody tr:hover td{background:none}
.comps input[type=text]{width:100%;min-height:34px;padding:0 8px;border-radius:7px;border:1px solid var(--line-2);background:var(--input);color:var(--ink);font-size:13px}
.comps .out{font-size:12.5px;color:var(--mute);white-space:nowrap;padding:0 8px;font-variant-numeric:tabular-nums}
.comps tr.off .out,.comps tr.off input[type=text]{opacity:.4}
.comps a{color:var(--g-txt)!important}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line-2);background:var(--card-2);display:grid;place-items:center;color:var(--mute)}
.icon-btn:hover{color:var(--red);border-color:rgba(255,130,120,.4)}
.arv-band{display:flex;flex-wrap:wrap;gap:20px;margin-top:12px;padding:13px 15px;background:var(--card-2);border:1px solid var(--line);border-radius:12px;font-size:12.5px;color:var(--mute)}
.arv-band b{display:block;font-size:17px;font-variant-numeric:tabular-nums;color:#fff}
.toggle{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:var(--ink)!important;flex-direction:row!important}
.toggle input{min-height:0!important;width:18px;height:18px;accent-color:var(--g)}
.rep-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.rep-bar label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mute);font-weight:500}
.rep-bar input,.rep-bar select{min-height:46px;padding:0 14px;border-radius:11px;border:1px solid var(--line-2);background:var(--input);font-size:15px;color:var(--ink)}
.rep-bar .addr{flex:1 1 320px}
.rep-status{margin-top:10px;font-size:13px;color:var(--mute);display:flex;align-items:center;gap:8px}
.rep-status.err{color:var(--red)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--g);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.rep-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;margin:20px 0 14px}
.rep-head h3{margin:0;font-size:21px;letter-spacing:-.02em;color:#fff}
.rep-head span{font-size:13px;color:var(--mute)}
.ranges{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.range{border:1px solid var(--line);border-radius:14px;padding:15px 17px;background:var(--card-2)}
.range.main{background:linear-gradient(135deg,rgba(118,190,67,.24),rgba(118,190,67,.06));border-color:rgba(118,190,67,.45);box-shadow:0 18px 40px -24px var(--g-glow)}
.range.main .rl{color:var(--g-txt)}.range.main .rv{color:#fff}.range.main .rs{color:var(--ink-2)}
.range .rl{font-size:12px;color:var(--mute);font-weight:500}
.range .rv{font-size:25px;font-weight:600;letter-spacing:-.025em;margin:3px 0;font-variant-numeric:tabular-nums;color:#fff}
.range .rs{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}

var $=function(s,r){return (r||document).querySelector(s)};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){if(v===''||v==null)return null;var n=Number(String(v).replace(/[$,\s]/g,''));return isFinite(n)?n:null}
function money(v){var n=num(v);if(n==null)return '—';var a=Math.abs(n);var s=a>=1e6?'$'+(a/1e6).toFixed(a>=1e7?1:2).replace(/\.?0+$/,'')+'M':a>=1e4?'$'+Math.round(a/1e3)+'K':'$'+a.toLocaleString();return (n<0?'-':'')+s}
function moneyFull(v){var n=num(v);return n==null?'—':(n<0?'-$':'$')+Math.abs(n).toLocaleString()}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fdate(s){if(!s)return '—';var p=String(s).split('-');if(p.length!==3)return esc(s);var d=new Date(+p[0],+p[1]-1,+p[2]);return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:(+p[0]!==new Date().getFullYear())?'numeric':undefined})}
function isDue(s){return !!s&&s<=today()}
function arr(v){return Array.isArray(v)?v:(v?[v]:[])}
function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('show')},2200)}
function find(coll,id){for(var i=0;i<data[coll].length;i++)if(data[coll][i].id===id)return data[coll][i];return null}
function fee(d){var f=num(d.assignmentFee);if(f!=null)return f;var a=num(d.askPrice),c=num(d.contractPrice);return (a!=null&&c!=null)?a-c:null}
function mao(s){var m=num(s.mao);if(m!=null)return m;var a=num(s.arv);if(a==null)return null;return Math.round(a*0.7-(num(s.repairs)||0))}
function tempPill(t){return t?'<span class="pill '+(t==='Hot'?'r':t==='Warm'?'a':'b')+'">'+esc(t)+'</span>':''}
function stagePill(s){if(!s)return '';var c=(s==='Closed'||s==='Under contract'||s==='Buyer assigned')?'g':(s==='Dead'?'r':(s==='Marketing to buyers'||s==='Offer made'||s==='Appointment set'?'a':''));return '<span class="pill '+c+'">'+esc(s)+'</span>'}
function copyText(t,msg){try{navigator.clipboard.writeText(t).then(function(){toast(msg||'Copied')},function(){toast('Copy blocked by the browser')})}catch(e){toast('Copy blocked by the browser')}}

/* ---------- storage ---------- */
function setSync(state,txt){var d=$('#sync-dot');d.className='dot'+(state==='ok'?' ok':state==='warn'?' warn':'');$('#sync-txt').textContent=txt}
function banner(t){var b=$('#banner');b.textContent=t||'';b.classList.toggle('show',!!t)}

function subscribe(){
  var timer=setTimeout(function(){setSync('warn','Still connecting…');banner('Can’t reach your saved data yet. Showing what has loaded so far.')},10000);
  ['deals','buyers','sellers','analyses','properties','companies'].forEach(function(c){
    db.collection(c).onSnapshot(function(snap){
      data[c]=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
      loaded[c]=true;_sc=null;
      if(!snap.metadata.fromCache){clearTimeout(timer);banner('');setSync('ok',localMode?'Saved in this browser':'Saved & synced')}
      render();
      if(open&&open.coll===c&&open.id&&!find(c,open.id))closeDrawer();
      else if(open&&open.coll===c&&open.id)refreshSide();
    },function(e){clearTimeout(timer);setSync('warn','Not synced');banner(e&&e.code==='revoked'?'Access to saved data ended for this visit.':'Couldn’t load saved '+c+' ('+(e&&e.code||'error')+').');})
  });
}
async function save(coll,id,body){
  body.updatedAt=new Date().toISOString();
  if(mem){
    if(id){var o=find(coll,id);Object.assign(o,body)}else{body.id='m'+Date.now()+Math.random().toString(36).slice(2,6);body.createdAt=body.updatedAt;data[coll].push(body);id=body.id}
    _sc=null;render();return id;
  }
  try{
    if(id){await db.collection(coll).doc(id).set(body);return id}
    body.createdAt=body.updatedAt;var ref=db.collection(coll).doc();await ref.set(body);return ref.id;
  }catch(e){handleErr(e);throw e}
}
async function patch(coll,id,part){
  part.updatedAt=new Date().toISOString();
  if(mem){Object.assign(find(coll,id),part);_sc=null;render();if(open&&open.coll===coll&&open.id===id)refreshSide();return}
  try{await db.collection(coll).doc(id).update(part)}catch(e){handleErr(e);throw e}
}
async function remove(coll,id){
  if(mem){data[coll]=data[coll].filter(function(x){return x.id!==id});render();return}
  try{await db.collection(coll).doc(id).delete()}catch(e){handleErr(e);throw e}
}
function handleErr(e){
  var c=e&&e.code;
  if(c==='invalid_argument')toast('You don’t have permission to change this data');
  else if(c==='quota_exceeded')toast('Storage is full — delete some old records');
  else if(c==='resource_exhausted')toast('Too many changes at once — wait a moment');
  else toast('Couldn’t save — check your connection');
}

function match(s,fields){if(!q)return true;var t=q.toLowerCase();return fields.some(function(f){return String(s[f]||'').toLowerCase().indexOf(t)>=0})}

function dashHTML(){
  var act=data.deals.filter(function(d){return ACTIVE_DEAL.indexOf(d.stage||'Lead')>=0});
  var pipe=act.reduce(function(a,d){return a+(num(d.askPrice)||0)},0);
  var fees=act.reduce(function(a,d){return a+(fee(d)||0)},0);
  var closed=data.deals.filter(function(d){return d.stage==='Closed'}).reduce(function(a,d){return a+(fee(d)||0)},0);
  var hot=data.sellers.filter(function(s){return s.temperature==='Hot'&&['Dead','Under contract'].indexOf(s.stage)<0}).length;
  var vip=data.buyers.filter(function(b){return b.status==='VIP'||b.status==='Active'}).length;
  var dueS=data.sellers.filter(function(s){return isDue(s.nextFollowUp)&&s.stage!=='Dead'}).map(function(s){return {c:'sellers',r:s,t:s.name,sub:(s.propertyAddress||'Seller lead'),d:s.nextFollowUp,p:tempPill(s.temperature)}});
  var dueB=data.buyers.filter(function(b){return isDue(b.nextFollowUp)}).map(function(b){return {c:'buyers',r:b,t:b.name,sub:(b.company||'Buyer'),d:b.nextFollowUp,p:'<span class="pill">Buyer</span>'}});
  var dueT=[];data.buyers.forEach(function(b){openTasks(b).forEach(function(t){if(isDue(t.due))dueT.push({rec:b.id,r:b,t:t.title,sub:b.name+(b.company&&b.company!==b.name?' · '+b.company:''),d:t.due,p:'<span class="pill a">'+esc(t.kind||'Task')+'</span>'})})});
  dueB=dueB.filter(function(x){return !openTasks(x.r).length});
  var dues=dueS.concat(dueB).concat(dueT).sort(function(a,b){return a.d<b.d?-1:1});
  var dl=data.deals.filter(function(d){return d.closeDate&&ACTIVE_DEAL.indexOf(d.stage||'Lead')>=0}).sort(function(a,b){return a.closeDate<b.closeDate?-1:1}).slice(0,6);
  var counts=DEAL_STAGES.map(function(s){return {s:s,n:data.deals.filter(function(d){return (d.stage||'Lead')===s}).length}});
  var maxc=Math.max.apply(null,counts.map(function(x){return x.n}).concat([1]));
  var h='<div class="kpis">'+
    kpi('Active deals',act.length)+kpi('Pipeline (asking)',money(pipe))+kpi('Projected fees',fees?money(fees):'—','g')+kpi('Fees closed',closed?money(closed):'—','g')+
    kpi('Properties',data.properties.filter(function(p){return PROP_ACTIVE.indexOf(p.status||'Evaluating')>=0}).length)+kpi('Contacts',data.buyers.length+(vip?' <small style="font-size:13px;color:var(--mute);font-weight:500">('+vip+' active)</small>':''))+kpi('Hot seller leads',hot)+kpi('Follow-ups due',dues.length)+'</div>';
  var S=scoreAll(),ads=activeDeals();
  if(ads.length&&data.buyers.length){h+='<div class="panel" style="margin-bottom:16px"><h2>Top prospects by property</h2><div class="grid2">'+ads.map(function(d){var top=data.buyers.map(function(b){var s=S[b.id];var p=s&&s.role!=='Partner'&&s.per.filter(function(x){return x.deal.id===d.id})[0];return p?{b:b,p:p}:null}).filter(Boolean).sort(function(a,b){return b.p.total-a.p.total}).slice(0,5);
    return '<div><p class="sec">'+esc(shortDeal(d))+' · '+money(d.askPrice)+'</p><div class="row-list">'+top.map(function(x){return '<button data-rec="'+esc(x.b.id)+'">'+av(x.b.name,x.b.company)+'<span class="grow"><span class="t">'+esc(x.b.name)+'</span><span class="s">'+esc((x.b.company&&x.b.company!==x.b.name?x.b.company+' · ':'')+(x.p.why[0]||'').replace(/^[^:]+: /,''))+'</span></span>'+scoreBar(x.p.total)+'</button>'}).join('')+'</div></div>'}).join('')+'</div></div>'}
  h+='<div class="grid2">';

function matchBuyers(d){
  var price=num(d.askPrice);var mk=String([d.market,d.county,d.address].join(' ')).toLowerCase();
  return data.buyers.filter(function(b){
    if(b.status==='Cold'||b.buyerType==='Partner / vendor'||leadStatusOf(b)==='Unqualified'||scoreOf(b).role==='Partner')return false;
    var at=arr(b.assetTypes);if(at.length&&d.assetType&&at.indexOf(d.assetType)<0&&!(d.assetType==='Land'&&at.indexOf('Lots')>=0)&&!(d.assetType==='Lots'&&at.indexOf('Land')>=0))return false;
    if(price!=null){var mn=num(b.minPrice),mx=num(b.maxPrice);if(mn!=null&&price<mn)return false;if(mx!=null&&mx>0&&price>mx)return false}
    return true;
  }).map(function(b){
    var areas=String(b.markets||'').toLowerCase().split(/[,;\/]+/).map(function(s){return s.trim()}).filter(Boolean);
    var hit=areas.some(function(a){return mk.indexOf(a)>=0||a.indexOf('atlanta')>=0||a.indexOf('metro')>=0});
    var pd=scoreOf(b).per.filter(function(p){return p.deal.id===d.id})[0];
    return {b:b,area:hit,score:pd?pd.total:0};
  }).sort(function(a,b){return b.score-a.score});
}

function blastText(d){
  var L=[];L.push('NEW DEAL: '+(d.name||''));
  if(d.address)L.push(d.address);

  });

function parseCSV(t){
  var rows=[],row=[],f='',i=0,qd=false;t=t.replace(/\r\n?/g,'\n');
  for(;i<t.length;i++){var c=t[i];
    if(qd){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else qd=false}else f+=c}
    else if(c==='"')qd=true;else if(c===','){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(function(r){return r.some(function(x){return x.trim()!==''})});
}

/* ---------- browser-storage fallback (hosted outside Claude) ---------- */
function localDb(){
  var KEY='dealdesk.v1.',subs={};
  function load(c){try{return JSON.parse(localStorage.getItem(KEY+c)||'{}')}catch(e){return {}}}
  function store(c,o){try{localStorage.setItem(KEY+c,JSON.stringify(o))}catch(e){var er=new Error('full');er.code='quota_exceeded';throw er}}
  function emit(c){var o=load(c);var docs=Object.keys(o).map(function(id){return {id:id,data:function(){return o[id]}}});(subs[c]||[]).forEach(function(f){f({docs:docs,metadata:{fromCache:false}})})}
  window.addEventListener('storage',function(e){if(e.key&&e.key.indexOf(KEY)===0)emit(e.key.slice(KEY.length))});
  return {collection:function(c){return {
    onSnapshot:function(f){(subs[c]=subs[c]||[]).push(f);setTimeout(function(){emit(c)},0);return function(){}},
    doc:function(id){id=id||('l'+Date.now().toString(36)+Math.random().toString(36).slice(2,7));return {id:id,
      set:async function(b){var o=load(c);o[id]=JSON.parse(JSON.stringify(b));store(c,o);emit(c)},
      update:async function(b){var o=load(c);o[id]=Object.assign(o[id]||{},JSON.parse(JSON.stringify(b)));store(c,o);emit(c)},
      delete:async function(){var o=load(c);delete o[id];store(c,o);emit(c)}}}}}}
}
